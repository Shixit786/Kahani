<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kahani Capture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background-color: #3A0A10;
      color: #FFFFFF;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 18px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 20px;
      height: 20px;
      color: #FFFFFF;
    }
    .logo {
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #EFE7DC;
      color: #3A0A10;
      border: 1px solid #E4D9CA;
      letter-spacing: 0.5px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      margin-bottom: 6px;
    }
    select, input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 9px 12px;
      color: #FFFFFF;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, background-color 0.15s;
    }
    select:focus, input:focus {
      border-color: #C9A35B;
      background: rgba(255,255,255,0.09);
    }
    select option {
      background: #2A070B;
      color: #FFFFFF;
    }
    button#captureBtn {
      width: 100%;
      background: #FFFFFF;
      color: #3A0A10;
      border: none;
      border-radius: 9999px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      transition: all 0.2s ease;
      margin-top: 6px;
    }
    button#captureBtn:hover {
      background: #EFE7DC;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    button#captureBtn:disabled {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.35);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #status {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      font-size: 12px;
      display: none;
      line-height: 1.5;
    }
    .status-success {
      background: #EFE7DC;
      border: 1px solid #E4D9CA;
      color: #3A0A10;
      box-shadow: 0 8px 24px rgba(42,7,11,0.25);
    }
    .status-error {
      background: #FDECEC;
      border: 1px solid rgba(229, 72, 77, 0.35);
      color: #C22830;
    }
    .hash-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      word-break: break-all;
      color: #EFE7DC;
      background: #2A070B;
      padding: 6px 8px;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 6px;
    }
    a.link {
      color: #3A0A10;
      text-decoration: underline;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    a.link:hover {
      color: #C9A35B;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m14 13-7.5 7.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0a2.12 2.12 0 0 1 0-3L11 10"/>
        <path d="m16 16 6-6"/>
        <path d="m8 8 6-6"/>
        <path d="m9 7 8 8"/>
        <path d="m21 11-8-8"/>
      </svg>
      <div class="logo">Kahani</div>
    </div>
    <div class="badge">SEC 63 BSA</div>
  </div>

  <div class="form-group">
    <label for="caseSelect">Target Case Matter</label>
    <select id="caseSelect">
      <option value="">Loading active cases...</option>
    </select>
  </div>

  <div class="form-group">
    <label for="capturedBy">Investigator / Custodian Name</label>
    <input type="text" id="capturedBy" placeholder="e.g. Insp. R. Verma" value="Investigator" />
  </div>

  <button id="captureBtn">
    <span>Capture Last 10 Messages</span>
  </button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
